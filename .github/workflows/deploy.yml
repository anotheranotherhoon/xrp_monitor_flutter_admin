name: Deploy Flutter Web to Oracle Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: admin-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Web
        run: flutter build web

      - name: Prepare release directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -eu
            RELEASE_DIR="$HOME/flutter-web/releases/${{ github.sha }}"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"

      - name: Upload release files
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "build/web/*"
          target: "~/flutter-web/releases/${{ github.sha }}"
          strip_components: 2

      - name: Activate release
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -eu
            RELEASE_DIR="$HOME/flutter-web/releases/${{ github.sha }}"
            DEPLOY_DIR="$HOME/flutter-web/web"
            PREVIOUS_DIR="$HOME/flutter-web/web.previous"

            test -f "$RELEASE_DIR/index.html"
            test -f "$RELEASE_DIR/flutter_bootstrap.js"
            chmod -R a+rX "$RELEASE_DIR"

            rm -rf "$PREVIOUS_DIR"
            mkdir -p "$PREVIOUS_DIR" "$DEPLOY_DIR"
            cp -a "$DEPLOY_DIR/." "$PREVIOUS_DIR/"
            find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            cp -a "$RELEASE_DIR/." "$DEPLOY_DIR/"
            rm -rf "$RELEASE_DIR"

            test -r "$DEPLOY_DIR/index.html"

            PROXY_NETWORK="xrp-monitor-proxy"
            BACKEND_CONTAINER="$(docker ps --filter label=com.docker.compose.service=app --format='{{.ID}}' | head -n 1)"
            if [ -z "$BACKEND_CONTAINER" ]; then
              echo "Running NestJS Compose app container not found."
              docker ps -a
              exit 1
            fi

            docker network inspect "$PROXY_NETWORK" > /dev/null 2>&1 ||
              docker network create "$PROXY_NETWORK" > /dev/null
            docker network connect --alias nestjs "$PROXY_NETWORK" "$BACKEND_CONTAINER" > /dev/null 2>&1 || true
            docker network connect "$PROXY_NETWORK" flutter-web > /dev/null 2>&1 || true

            CONTAINER_STATUS="$(docker inspect --format='{{.State.Status}}' flutter-web)"
            if [ "$CONTAINER_STATUS" != "running" ]; then
              RESTART_POLICY="$(docker inspect --format='{{.HostConfig.RestartPolicy.Name}}' flutter-web)"
              docker update --restart=no flutter-web > /dev/null
              docker stop --time 10 flutter-web > /dev/null 2>&1 || true
              docker start flutter-web > /dev/null

              ATTEMPT=0
              while [ "$ATTEMPT" -lt 30 ]; do
                CONTAINER_STATUS="$(docker inspect --format='{{.State.Status}}' flutter-web)"
                if [ "$CONTAINER_STATUS" = "running" ]; then
                  break
                fi
                ATTEMPT=$((ATTEMPT + 1))
                sleep 1
              done

              if [ "$RESTART_POLICY" != "no" ]; then
                docker update --restart="$RESTART_POLICY" flutter-web > /dev/null
              fi
            fi

            if [ "$CONTAINER_STATUS" != "running" ]; then
              docker inspect --format='status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' flutter-web
              docker logs --tail=100 flutter-web
              exit 1
            fi

            if ! docker exec flutter-web test -r /usr/share/nginx/html/index.html ||
               ! docker exec flutter-web nginx -t; then
              docker inspect --format='status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' flutter-web
              docker logs --tail=100 flutter-web
              exit 1
            fi

      - name: Verify production
        run: |
          curl --fail --show-error --silent \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            https://xrp-admin.p-e.kr/ > /dev/null
